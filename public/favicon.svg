<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PulsePost">
  <!--
    PulsePost brand mark.

    Three edge nodes converging on a pulse line — the same shape the in-app
    header logo uses, on a 64-unit grid so it stays crisp at favicon sizes.

    Two details that matter at 16px:
      - Strokes are 4 units (6.25% of the viewBox). Anything thinner anti-aliases
        into mush once the browser downsamples.
      - The pulse is the ONLY interior detail. The header version carries a
        second overlapping path for a "double pulse" read; at favicon scale that
        reads as a smudge, so it is dropped rather than scaled down.

    The tile is a self-contained gradient rather than a flat fill, because a
    favicon is fetched outside the document: `var(--color-up)` and the clay
    surfaces do not exist in that context, and a mark that has to guess at a
    theme it cannot read will be wrong in one of them. These values are the
    product's own -- the lilac of --color-accent and the green of --color-up --
    so the tab icon and the app agree in both themes.
  -->
  <defs>
    <linearGradient id="pp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7565db" />
      <stop offset="100%" stop-color="#4f42a8" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#pp-tile)" />

  <circle cx="16" cy="18" r="5" fill="#f4f6fd" />
  <circle cx="16" cy="46" r="5" fill="#f4f6fd" />
  <circle cx="48" cy="32" r="5.5" fill="#7ee2a8" />

  <path
    d="M22 18h6a6 6 0 016 6v4a6 6 0 006 6h8"
    stroke="#f4f6fd"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M22 46h6a6 6 0 006-6v-4a6 6 0 016-6h8"
    stroke="#f4f6fd"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />
</svg>