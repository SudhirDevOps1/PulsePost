<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)" />
    <title>PulsePost</title>
    <meta name="description" content="Self-hosted uptime monitoring on Cloudflare's edge." />

    <!--
      Icons, least-capable first.

      PNG before SVG deliberately. Windows launchers, most desktop shells, and
      anything reading the manifest prefer a raster file, and a browser only
      falls through to a later <link> when an earlier one fails to *parse* --
      not when it merely renders at the wrong size. iOS ignores an SVG
      `apple-touch-icon` outright and screenshots the page instead, which is the
      whole reason this is a list rather than a one-line SVG reference.

      Regenerate with `node scripts/make-icons.mjs` after editing the SVG.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Social preview. Without these a shared link renders as a bare URL card
      with no title and no image.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PulsePost" />
    <meta property="og:description" content="Self-hosted uptime monitoring on Cloudflare's edge." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />

    <script>
      /*
       * Apply the stored theme before first paint.
       *
       * This has to be an inline script, not a module import. React has not
       * hydrated when the stylesheet renders, so a light-mode user would get a
       * full dark flash on every navigation. Setting one attribute here is the
       * difference between "the app is dark" and "the app was black for 200ms".
       */
      (function () {
        try {
          var stored = localStorage.getItem('pulsepost.theme');
          // Default is 'light' — the clay theme. 'system' is only used when the
          // visitor explicitly picked it.
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light';
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          /* Private mode, or storage disabled. Dark remains the default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
